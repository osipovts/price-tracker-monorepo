name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Format, lint, types and the unit tests of every package.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The version comes from "packageManager" of package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The unit tests of the readers launch a real Camoufox over pages of their own.
      - name: Read the version of camoufox-js
        id: camoufox
        run: echo "version=$(node -p "require('./apps/price-fetcher/node_modules/camoufox-js/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: camoufox-cache
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ steps.camoufox.outputs.version }}

      - name: Install Camoufox
        if: steps.camoufox-cache.outputs.cache-hit != 'true'
        env:
          # camoufox-js looks up the releases of the browser over the API of GitHub.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter price-fetcher exec camoufox-js fetch

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm -r typecheck

      - run: pnpm -r test

  # The hub with the built panels over a real Postgres, Redis and S3 in Docker, in a real Chromium.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Read the version of playwright
        id: playwright
        run: echo "version=$(node -p "require('./apps/hub/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter hub exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter hub exec playwright install-deps chromium

      - run: pnpm test:e2e
